services:
  - type: web
    name: digidex-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_URL
        sync: false
    healthCheckPath: /health
    autoDeploy: true
    rootDir: backend
